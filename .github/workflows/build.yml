
name: Unpack VPN source

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -type f | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Save extracted files
        run: |
          cp -a extracted/. .
          rm -rf extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automatically unpack VPN source" || echo "No changes"
          git push
          


name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          mkdir -p _source

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting source ZIP..."
            unzip -oq "$ZIP_FILE" -d _source
          fi

          PROJECT_FILE=$(find . -type f \
            -path '*/app/build.gradle.kts' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          DIR=$(dirname "$(dirname "$PROJECT_FILE")")

          if [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          echo "PROJ=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"
          ls -la "$DIR"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download libv2ray.aar
        working-directory: ${{ env.PROJ }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p app/libs

          gh release download \
            -R 2dust/AndroidLibXrayLite \
            -p '*.aar' \
            -D app/libs \
            --clobber

          FOUND=$(find app/libs -maxdepth 1 \
            -type f -name '*.aar' \
            ! -name 'libv2ray.aar' | head -n 1)

          if [ -n "$FOUND" ]; then
            mv "$FOUND" app/libs/libv2ray.aar
          fi

          if [ ! -s app/libs/libv2ray.aar ]; then
            echo "ERROR: libv2ray.aar not found"
            exit 1
          fi

          ls -lh app/libs

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJ }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Checking APK..."
          unzip -t "$APK"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          

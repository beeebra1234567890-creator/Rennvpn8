
name: Build RENT VPN APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract ZIP if needed
        run: |
          mkdir -p _source_unpack
          find . -maxdepth 2 -type f -iname "*.zip" \
            -not -path "./_source_unpack/*" | while read zip; do
              unzip -o "$zip" -d _source_unpack
          done

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find . -type f \
            -path "*/app/build.gradle.kts" \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found project: $PROJECT_DIR"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Xray library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PROJECT_DIR/app/libs"
          gh release download \
            -R 2dust/AndroidLibXrayLite \
            -p '*.aar' \
            -D "$PROJECT_DIR/app/libs" \
            --clobber

          for f in "$PROJECT_DIR"/app/libs/*.aar; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "libv2ray.aar" ]; then
              mv "$f" "$PROJECT_DIR/app/libs/libv2ray.aar"
              break
            fi
          done

          ls -lh "$PROJECT_DIR/app/libs"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
          
